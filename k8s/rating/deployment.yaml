apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-service
  namespace: cake-delight

spec:
  replicas: 1

  selector:
    matchLabels:
      app: rating-service

  template:
    metadata:
      labels:
        app: rating-service

    spec:
      containers:
        - name: rating-service

          image: cake-delight-rating-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5003

          env:
            - name: PORT
              value: "5003"

            - name: MONGO_URI
              value: "mongodb://mongodb:27017/ratingdb"

          readinessProbe:
            tcpSocket:
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 5003
            initialDelaySeconds: 20
            periodSeconds: 10